@if (postspet.length) {
  <div class="postpets--grid" [class.profileGrid]="profilePosts">
    @for (postpet of postspet; track $index) {
      <app-postpet [postpet]="postpet"></app-postpet>
    }
  </div>
}

@if (morePostspet) {
  <div>
    <div class="load-container">
      <button class="load-button" (click)="onLoadMore()">
        @if (!isLoadingMore) {
          <span>Cargar más</span>
        } @else {
          <app-spinner></app-spinner>
        }
      </button>
    </div>
  </div>
}
